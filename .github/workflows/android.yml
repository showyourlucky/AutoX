name: Android CI build
on:
  workflow_dispatch:
  push:
    tags:
      - '*'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Set output
        id: vars
        run: echo "short_ref=${GITHUB_REF#refs/*/}" >> $GITHUB_OUTPUT
      - name: checkout
        uses: actions/checkout@v1
      - name: set up JDK 15
        uses: actions/setup-java@v1
        with:
          java-version: 15
      - name: Create sign.properties
        run: |
          mkdir -p keystores
          echo "storeFile=apkbuilder/src/main/assets/autox-default.jks" > keystores/sign.properties
          echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" >> keystores/sign.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> keystores/sign.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> keystores/sign.properties
      - name: Build inrt template
        run: |
          chmod 777 ./gradlew
          ./gradlew inrt:assembleTemplate
      - name: Copy template to app assets
        run: |
          ls inrt/build/outputs/apk/template/release
          mv inrt/build/outputs/apk/template/release/*.apk app/src/main/assets/template.apk
          ls app/src/main/assets
      - name: Build App
        run: ./gradlew app:assembleV6
      - name: create-gh-release
        if: github.repository == 'kkevsekk1/AutoX'
        uses: taiki-e/create-gh-release-action@v1
        with:
          changelog: CHANGELOG.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: 'app/build/outputs/apk/v6/release/**'
